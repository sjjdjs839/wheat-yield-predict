# 全局配置 —— 严格对齐《模型组任务书 v2》第 3、5 章规格



# ---- 路径 ----

paths:

  raw_weather: "data/raw/weather"      # 数据组气象包：{城市}/{县}.csv

  raw_yield: "data/raw/county_yield_train.csv"   # 模型训练标签（清洗后农业县，去掉纯城区）
  raw_yield_map: "data/raw/county_yield.csv"      # 地图显示用全量标签（含城区）

  raw_yield_demo: "data/demo/county_yield_demo.csv"  # 演示标签（界面强制标注）

  raw_station: "data/raw/station_county.csv"

  processed: "data/processed"

  models: "output/models"

  reports: "output/reports"

  charts: "output/charts"

  dashboard: "output/dashboard"

  uploads: "web/uploads"



# ---- 气象数据读取 ----

weather:

  skiprows: 16          # NASA POWER 注释头：第 1-16 行，第 17 行为列名

  missing_value: -999

  total_days: 5479      # 2010-01-01 ~ 2024-12-31

  params: [T2M_MAX, T2M_MIN, T2M, PRECTOTCORR, WS2M, ALLSKY_SFC_SW_DWN, T2MDEW, RH2M]



