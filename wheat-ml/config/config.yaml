# ---- 生育期划分（任务书表 4 口径）----

stages:

  full_season: [3, 4, 5, 6]      # 全生育期（返青—成熟）

  stage_34: [3, 4]               # 返青拔节期

  stage_56: [5, 6]               # 灌浆成熟期

gdd_base_temp: 10                # 生长度日基温 Σ(T2M-10)



# ---- 20 个特征（任务书表 4，顺序与名称必须一致）----

feature_cols:

  - spi_12

  - precip_anom

  - hot_days

  - cold_days

  - gdd

  - season_tmax

  - season_tmin

  - season_precip

  - season_wind

  - season_sunshine

  - season_tmax_34

  - season_precip_34

  - gdd_34

  - season_tmax_56

  - season_precip_56

  - gdd_56

  - hot_dry_days
  - year_index
  - county_prior



# ---- 模型口径（项目方案 第六章：按年份划分，禁止随机拆分）----

model:

  random_state: 42

  split:

    method: "year"                 # 按年份划分训练/测试集

    test_years: [2022, 2023, 2024] # 测试集年份（时间上位于训练集之后）

  random_forest:

    n_estimators: 300

  linear_regression: {}

  # 无真实产量标签时，是否允许使用「演示标签」跑通预测链路

  # true  -> 读取 paths.raw_yield_demo，界面与报告强制标注「演示数据」

  # false -> 预测页仅提示缺少产量标签

  allow_demo_labels: true



# ---- 参考基线（任务书表 5，24 条样本）----

reference_baseline:

  random_forest: {r2: 0.875, rmse: 3.01, mae: 2.73, n: 24}

  linear_regression: {r2: 0.658, rmse: 4.97, mae: 4.47, n: 24}



# ---- 数据库（项目内免安装 MySQL 8，data/mysql，端口 3307）----

# enabled=false 或连接失败时，系统自动回退到 CSV 数据链路

database:

  enabled: true

  host: "127.0.0.1"

  port: 3306

  user: "root"

  password: "Root@123456"

  name: "wheat_ml"

  charset: "utf8mb4"

  connect_timeout: 3

  local_infile: true



# ---- 风险分级 ----

risk:

  levels:

    - {name: "低风险", min: 0,  max: 25}

    - {name: "中风险", min: 25, max: 50}

    - {name: "偏高风险", min: 50, max: 75}

    - {name: "高风险", min: 75, max: 100}

  # 必须命中的真实灾害案例（任务书步骤 9）

  known_disasters:

    - {county: "兰考", year: 2011, type: "春旱", note: "3-4 月降水约 16mm（常年约 40mm）"}

    - {county: "尉氏", year: 2012, type: "干热风", note: "5-6 月干热风约 10 天"}



# ---- 小麦生育期（项目方案表 1：阶段 + 建议方向）----

# 日期按河南冬小麦常年农时划分，用于农事建议与阶段气象统计

growth_stages:

  - {key: greening, name: "返青期",   start: "02-20", end: "03-10",

     focus: "结合土壤墒情安排灌溉，做好苗情管理。"}

  - {key: jointing, name: "拔节期",   start: "03-11", end: "04-10",

     focus: "关注水肥管理，结合苗情合理追肥。"}

  - {key: heading,  name: "抽穗扬花期", start: "04-11", end: "05-05",

     focus: "关注田间湿度及病虫害防治。"}

  - {key: filling,  name: "灌浆期",   start: "05-06", end: "05-31",

     focus: "关注高温、干旱等天气条件，及时采取田间管理措施。"}

  - {key: maturity, name: "成熟期",   start: "06-01", end: "06-10",

     focus: "关注天气变化，合理安排收获。"}



# ---- 数据上传与校验（项目方案 第三章）----

upload:

  allowed_ext: [".csv", ".xlsx", ".xls"]

  max_size_mb: 50

  year_min: 2010

  year_max: 2024

  rh_range: [0, 100]            # 相对湿度合理区间 %

  tmax_tmin_tolerance: 0.5      # 最高温允许低于最低温的容差 ℃

  radiation_unit_max: 40        # 短波辐射超过该值视为 W/m2，需换算 MJ/m2/day

  radiation_unit_factor: 0.0864 # W/m2 × 0.0864 = MJ/m2/day

  min_days_per_year: 300        # 单年记录少于该值告警



# ---- 产量预警（项目方案 3.3）----

alert:

  # 默认预警线 = 县域常年单产 × 该系数，可在页面上自定义

  default_ratio: 0.95

  level_normal: "正常"

  level_warning: "预警"



# ---- Web 应用 ----

web:

  host: "127.0.0.1"

  port: 5000

  debug: false

  title: "河南省小麦气象数据分析与产量预测系统"

