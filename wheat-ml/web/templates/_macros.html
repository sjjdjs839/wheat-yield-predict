{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" aria-hidden="true" focusable="false"><use href="#icon-{{ name }}"></use></svg>
{%- endmacro %}

{% macro mark(cls='') -%}
<svg class="{{ cls }}" aria-hidden="true" focusable="false"><use href="#wheat-mark"></use></svg>
{%- endmacro %}

{% macro page_head(title, lead=None, badges=None) -%}
<section class="work-head">
  <div class="container work-head-inner">
    <div class="work-head-copy">
      <h1>{{ title }}</h1>
      {% if lead %}<p class="work-head-lead">{{ lead }}</p>{% endif %}
    </div>
    {% if badges %}
    <div class="work-head-meta">
      {% for badge in badges if badge %}<span class="wh-chip">{{ badge }}</span>{% endfor %}
    </div>
    {% endif %}
  </div>
</section>
{%- endmacro %}
